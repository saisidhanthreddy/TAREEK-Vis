name: Cross-Platform CMake Build & Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-package:
    name: Build & Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # Generic matrix strategy for cross-platform compatibility
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        build_type: [Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev zlib1g-dev

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.*'
        modules: 'qtbase qtdeclarative'
        cache: true

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build 
        -DCMAKE_BUILD_TYPE=${{matrix.build_type}} 
        -S ${{github.workspace}}

    - name: Build Project
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_type}} --parallel 4

    # --- NEW PACKAGING STEPS ---

    - name: Package macOS (DMG)
      if: runner.os == 'macOS'
      run: |
        # macdeployqt bundles the Qt frameworks into the app and creates the DMG
        macdeployqt ${{github.workspace}}/build/TAREEK-Vis.app -dmg
        
    - name: Package Linux (TAR.GZ)
      if: runner.os == 'Linux'
      run: |
        cd ${{github.workspace}}/build
        tar -czvf TAREEK-Vis-Linux.tar.gz TAREEK-Vis
        
    - name: Package Windows (ZIP)
      if: runner.os == 'Windows'
      run: |
        # windeployqt pulls the required Qt DLLs into the executable's directory
        windeployqt ${{github.workspace}}/build/TAREEK-Vis.exe
        Compress-Archive -Path ${{github.workspace}}/build/* -DestinationPath ${{github.workspace}}/TAREEK-Vis-Windows.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TAREEK-Vis-${{ matrix.os }}-Artifacts
        # Uses wildcards to grab the correctly packaged artifact regardless of OS
        path: |
          ${{github.workspace}}/build/*.dmg
          ${{github.workspace}}/build/*.tar.gz
          ${{github.workspace}}/*.zip
        if-no-files-found: warn